<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D1063">
<title>Air Cairo | Hurghada Campaign</title>
<meta name="description" content="Air Cairo Hurghada campaign presentation and social story experience.">
<style>
@font-face{font-family:Poppins;src:url('assets/fonts/Poppins-400.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Poppins;src:url('assets/fonts/Poppins-600.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
:root{--purple:#3D1063;--purple2:#5C2A9D;--orange:#F58220;--wash:#F9F3FB;--text:#333;--panel:rgba(20,8,31,.82)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Poppins,Arial,sans-serif;background:#11091a;color:#fff;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 20%,#34134a 0,#16091f 48%,#0b0710 100%)}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(90deg,var(--purple),#51154A 72%,var(--orange));box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:8}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.2px}.mark{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--orange),#ffb25b);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.actions{display:flex;gap:8px}.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;padding:8px 12px;border-radius:999px;font:600 12px Poppins;cursor:pointer;backdrop-filter:blur(8px)}.btn:hover{background:rgba(255,255,255,.2)}
.stage{position:relative;min-height:0;display:grid;place-items:center;padding:18px 72px 14px}.frame{position:relative;max-width:min(1440px,100%);max-height:100%;width:100%;height:100%;display:grid;place-items:center}
.slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:18px;box-shadow:0 26px 70px rgba(0,0,0,.45);background:#22112f;user-select:none;-webkit-user-drag:none;transition:opacity .22s ease,transform .22s ease}.slide.swap{opacity:.18;transform:scale(.985)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:var(--panel);color:white;font-size:26px;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:5}.nav:hover{background:var(--purple2)}.prev{left:16px}.next{right:16px}
.bottom{height:58px;padding:8px 16px 10px;background:rgba(9,4,13,.9);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;z-index:8}.status{font-size:12px;opacity:.78}.status.right{text-align:right}.dots{display:flex;gap:5px;max-width:46vw;overflow:hidden;justify-content:center}.dot{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.28);cursor:pointer;flex:0 0 auto}.dot.active{width:20px;border-radius:999px;background:var(--orange)}
.progress{position:absolute;left:0;right:0;bottom:58px;height:3px;background:rgba(255,255,255,.08);z-index:9}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple2),var(--orange));transition:width .2s linear}
.modal{position:fixed;inset:0;background:rgba(5,2,8,.9);display:none;place-items:center;padding:24px;z-index:30}.modal.open{display:grid}.modal-card{position:relative;width:min(430px,94vw);height:min(82vh,760px);background:#000;border-radius:22px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.6)}.modal video{width:100%;height:100%;object-fit:contain;background:#000}.close{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:22px;cursor:pointer}
.mobile-badge{display:none}
@media (max-width:760px),(orientation:portrait) and (max-width:1024px){.topbar{height:52px;padding:0 10px}.brand span:last-child{font-size:12px}.mark{width:28px;height:28px}.actions .pdf{display:none}.btn{padding:7px 9px}.stage{padding:10px 48px 8px}.slide{border-radius:14px}.nav{width:38px;height:38px;font-size:22px}.prev{left:6px}.next{right:6px}.bottom{height:52px;padding:7px 10px}.status{font-size:10px}.dots{max-width:44vw}.progress{bottom:52px}.mobile-badge{display:inline-block;font-size:9px;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.12)}}
@media (max-width:460px){.brand .title{display:none}.stage{padding-left:42px;padding-right:42px}.status.right{display:none}.bottom{grid-template-columns:1fr auto}.dots{justify-content:flex-end;max-width:58vw}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span><span class="title">AIR CAIRO · HURGHADA</span><span class="mobile-badge">CAMPAIGN</span></div><div class="actions"><button class="btn" id="autoBtn">Auto: Off</button><button class="btn" id="reelBtn">Watch Reel</button><a class="btn pdf" href="assets/media/AirCairo_Hurghada_Campaign_Light_16x9.pdf" target="_blank" rel="noopener">PDF</a></div></header>
<main class="stage" id="stage"><button class="nav prev" id="prevBtn" aria-label="Previous">‹</button><div class="frame"><img class="slide" id="slide" alt="Air Cairo Hurghada campaign slide"></div><button class="nav next" id="nextBtn" aria-label="Next">›</button></main>
<div class="progress"><i id="progress"></i></div>
<footer class="bottom"><div class="status" id="status">Slide 1</div><div class="dots" id="dots"></div><div class="status right">Arrow keys · Swipe · Space to autoplay</div></footer>
</div>
<div class="modal" id="reelModal" role="dialog" aria-modal="true" aria-label="Hurghada campaign reel"><div class="modal-card"><button class="close" id="closeReel" aria-label="Close">×</button><video id="reel" controls playsinline preload="metadata"><source src="assets/media/AirCairo_Hurghada_Reel_1080x1920.mp4" type="video/mp4"></video></div></div>
<script>
const desktopSlides=['01_title.jpg','02_overview.jpg','03_importance.jpg','04_infrastructure.jpg','05_terminals.jpg','06_terminal1.jpg','07_terminal2.jpg','08_airlines.jpg','09_experience.jpg','10_flow.jpg','11_strategic.jpg','12_expansion.jpg','13_destinations.jpg','14_travel.jpg','15_network_w26.jpg','16_closing.jpg'].map(x=>'assets/desktop/'+x);
const mobileSlides=['01_Hurghada_Gateway_1080x1920.png','02_Discover_Red_Sea_1080x1920.png','03_HRG_Airport_1080x1920.png','04_KSA_to_World_1080x1920.png','05_New_Experience_1080x1920.png','06_KSA_Europe_Africa_1080x1920.png','07_Destinations_1080x1920.png','08_Smart_Connection_1080x1920.png'].map(x=>'assets/mobile/'+x);
const slide=document.getElementById('slide'),dots=document.getElementById('dots'),status=document.getElementById('status'),progress=document.getElementById('progress'),autoBtn=document.getElementById('autoBtn');
let list=[],index=0,auto=false,timer=null,started=Date.now();
function isMobile(){return matchMedia('(max-width:760px)').matches || (matchMedia('(orientation:portrait)').matches && matchMedia('(max-width:1024px)').matches)}
function rebuild(keep=true){const old=list;list=isMobile()?mobileSlides:desktopSlides;if(!keep||old!==list)index=Math.min(index,list.length-1);dots.innerHTML='';list.forEach((_,i)=>{const b=document.createElement('button');b.className='dot';b.ariaLabel='Go to '+(i+1);b.onclick=()=>go(i);dots.appendChild(b)});render()}
function render(){slide.classList.add('swap');setTimeout(()=>{slide.src=list[index];slide.onload=()=>slide.classList.remove('swap');status.textContent=(isMobile()?'Story ':'Slide ')+(index+1)+' / '+list.length;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===index));progress.style.width=((index+1)/list.length*100)+'%';},90)}
function go(i){index=(i+list.length)%list.length;render();restartAuto()}
function next(){go(index+1)}function prev(){go(index-1)}
function restartAuto(){if(timer){clearInterval(timer);timer=null}if(auto){timer=setInterval(next,6500)}}
autoBtn.onclick=()=>{auto=!auto;autoBtn.textContent='Auto: '+(auto?'On':'Off');restartAuto()};document.getElementById('nextBtn').onclick=next;document.getElementById('prevBtn').onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();autoBtn.click()}if(e.key==='Escape')closeReel()});
let sx=0;document.getElementById('stage').addEventListener('pointerdown',e=>sx=e.clientX);document.getElementById('stage').addEventListener('pointerup',e=>{const dx=e.clientX-sx;if(Math.abs(dx)>55)(dx<0?next:prev)()});
const modal=document.getElementById('reelModal'),reel=document.getElementById('reel');function closeReel(){modal.classList.remove('open');reel.pause()}document.getElementById('reelBtn').onclick=()=>{modal.classList.add('open');reel.currentTime=0;reel.play().catch(()=>{})};document.getElementById('closeReel').onclick=closeReel;modal.onclick=e=>{if(e.target===modal)closeReel()};
let lastMobile=isMobile();addEventListener('resize',()=>{const now=isMobile();if(now!==lastMobile){lastMobile=now;index=0;rebuild(false)}});rebuild(false);
</script>
</body>
</html>
