<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3D1063"><title>Air Cairo | Hurghada Campaign</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#160b20;color:#fff}.wrap{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#3D1063,#160b20 55%,#0d0812)}.card{width:min(560px,100%);text-align:center;padding:30px;border:1px solid rgba(255,255,255,.15);border-radius:24px;background:rgba(255,255,255,.07);backdrop-filter:blur(15px)}h1{margin:0 0 8px;font-size:28px}.accent{color:#F58220}.sub{opacity:.75;margin:0 0 24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{display:block;padding:16px;border-radius:16px;text-decoration:none;color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.17);background:#3D1063}a.mobile{background:#F58220;color:#2a1108;border-color:#F58220}.note{font-size:12px;opacity:.55;margin-top:18px}@media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:22px}}</style></head>
<body><main class="wrap"><section class="card"><h1>Air Cairo <span class="accent">Hurghada</span></h1><p class="sub">Choose the optimized experience for your device.</p><div class="choices"><a href="desktop/index.html">Desktop</a><a class="mobile" href="mobile/index.html">Mobile</a></div><p class="note" id="hint">Recommended view will open automatically.</p></section></main>
<script>const p=new URLSearchParams(location.search);if(!p.has('choose')){const mobile=matchMedia('(max-width: 820px)').matches||/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);setTimeout(()=>location.replace(mobile?'mobile/index.html':'desktop/index.html'),650)}</script></body></html>
